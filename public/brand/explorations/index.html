<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Logo Directions — Satyajit Senapati</title>
    <link rel="icon" href="../../favicon.svg" />
    <style>
      @font-face {
        font-family: Manrope;
        src: url("../../fonts/manrope-latin.woff2") format("woff2");
        font-weight: 200 800;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f4ef;
        color: #26242c;
        font:
          450 14px/1.6 Manrope,
          sans-serif;
      }
      main {
        width: min(1400px, calc(100% - 64px));
        margin: auto;
        padding: 42px 0 28px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 32px;
        align-items: center;
        margin-bottom: 28px;
      }
      h1 {
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: -0.045em;
        margin: 8px 0 12px;
        font-weight: 650;
      }
      p {
        margin: 0;
        color: #64616c;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.15em;
        font-weight: 600;
        color: #7253a5;
      }
      .baseline {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-shrink: 0;
        border: 1px solid #dcd7d0;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 12px;
      }
      .baseline img {
        width: 34px;
        height: 34px;
      }
      .baseline strong {
        display: block;
        font-weight: 600;
      }
      .baseline span {
        color: #64616c;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .card {
        background: #fffefa;
        border: 1px solid #dcd7d0;
        border-radius: 18px;
        overflow: hidden;
      }
      .samples {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .sample {
        height: 204px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .sample svg {
        width: 104px;
        height: 104px;
      }
      .sample.dark {
        background: #19171f;
        color: #c2aff5;
      }
      .sample.light {
        background: #ede8f2;
        color: #7253a5;
      }
      .sample > span {
        position: absolute;
        bottom: 13px;
        left: 20px;
        font-size: 10px;
        letter-spacing: 0.13em;
        font-weight: 500;
        opacity: 0.75;
      }
      .detail {
        padding: 18px 22px 16px;
      }
      .title {
        display: flex;
        gap: 12px;
        align-items: baseline;
      }
      h2 {
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.03em;
        margin: 0 0 5px;
      }
      .number {
        font-size: 11px;
        color: #7253a5;
        font-weight: 600;
      }
      .description {
        font-size: 12px;
        line-height: 1.65;
        min-height: 20px;
      }
      .in-use {
        border-top: 1px solid #e1ddd6;
        margin-top: 14px;
        padding-top: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .wordmark svg {
        width: 28px;
        height: 28px;
        color: #7253a5;
      }
      .sizes {
        display: flex;
        gap: 13px;
        align-items: center;
      }
      .size {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #6b6573;
        font-size: 9px;
      }
      .tile {
        display: grid;
        place-items: center;
        background: #19171f;
        color: #c2aff5;
        border-radius: 25%;
      }
      .tile svg {
        width: 100%;
        height: 100%;
        padding: 2px;
      }
      .mono {
        color: #26242c;
        background: none;
      }
      .download {
        color: #60418f;
        font-size: 11px;
        font-weight: 600;
        text-decoration: none;
        padding: 10px 0;
        display: inline-block;
      }
      .download:hover {
        text-decoration: underline;
      }
      .download:focus-visible {
        outline: 2px solid #7253a5;
        outline-offset: 4px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 22px;
        font-size: 12px;
        color: #64616c;
      }
      footer a {
        color: #60418f;
        text-decoration: none;
      }
      .error {
        padding: 30px;
      }
      @media (max-width: 850px) {
        main {
          width: calc(100% - 32px);
          padding-top: 26px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        header {
          align-items: start;
        }
        .baseline {
          display: none;
        }
        h1 {
          font-size: 31px;
        }
        .sample {
          height: 185px;
        }
        footer {
          flex-direction: column;
          gap: 8px;
        }
      }
      @media (max-width: 420px) {
        .in-use {
          align-items: start;
          flex-direction: column;
          gap: 12px;
        }
        .detail {
          padding: 17px;
        }
        .sample svg {
          width: 90px;
          height: 90px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">SATYAJIT SENAPATI / IDENTITY EXPLORATIONS</p>
          <h1>One Identity. Four Directions.</h1>
          <p>
            Compare the silhouette, the wordmark, and how each holds up at
            favicon size.
          </p>
        </div>
        <div class="baseline">
          <img src="00-folded.svg" alt="Previous Folded S logo" />
          <div>
            <strong>Previous Identity</strong
            ><span>Folded S · For Reference</span>
          </div>
        </div>
      </header>
      <div class="grid" id="options"></div>
      <footer>
        <span
          >Choose 01–04, or keep the current Folded S. Every concept is an
          editable vector.</span
        ><a href="../../../">Back to Portfolio ↗</a>
      </footer>
    </main>
    <script type="module">
      const options = [
        {
          id: "01",
          file: "01-signature.svg",
          name: "Signature S",
          description:
            "A confident, sculpted S with the familiar signature dot.",
        },
        {
          id: "02",
          file: "02-continuous.svg",
          name: "Continuous S",
          description:
            "A rounded, directional path connecting input to output.",
        },
        {
          id: "03",
          file: "03-twin.svg",
          name: "Twin S",
          description: "Two interlocking initials for Satyajit Senapati.",
        },
        {
          id: "04",
          file: "04-cut.svg",
          name: "Cut S",
          description:
            "An angular, architectural mark with a decisive diagonal cut.",
        },
      ];
      const root = document.querySelector("#options");
      try {
        const cards = await Promise.all(
          options.map(async (option) => {
            const response = await fetch(option.file);
            if (!response.ok) throw new Error("Logo could not be loaded");
            const svg = (await response.text()).replace(
              "<svg ",
              '<svg aria-hidden="true" ',
            );
            return `<article class="card"><div class="samples"><div class="sample dark">${svg}<span>INK / LILAC</span></div><div class="sample light">${svg}<span>IVORY / VIOLET</span></div></div><div class="detail"><div class="title"><span class="number">${option.id}</span><h2>${option.name}</h2></div><p class="description">${option.description}</p><div class="in-use"><div class="wordmark">${svg}<span>Satyajit Senapati</span></div><div class="sizes"><div class="size"><div class="tile" style="width:16px;height:16px">${svg}</div>16</div><div class="size"><div class="tile" style="width:32px;height:32px">${svg}</div>32</div><div class="size"><div class="tile mono" style="width:32px;height:32px">${svg}</div>Mono</div></div></div><a class="download" href="${option.file}" download>Download SVG ↗</a></div></article>`;
          }),
        );
        root.innerHTML = cards.join("");
      } catch {
        root.innerHTML =
          '<p class="error">The logo previews could not load. Refresh this page to try again.</p>';
      }
    </script>
  </body>
</html>
